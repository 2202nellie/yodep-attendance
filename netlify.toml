[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase web config values are public by design (security is enforced by
  # Firestore/Auth rules) and Vite inlines VITE_* vars into the client bundle,
  # so exclude them from Netlify's secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"
